name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: No TODO/FIXME/NotImplemented in package
        if: runner.os == 'Linux'
        run: "! grep -rn 'TODO\\|FIXME\\|NotImplemented' blockforge/"
      - name: Tests with coverage
        run: pytest -v --cov=blockforge/blockchain --cov=blockforge/storage --cov-report=term-missing --cov-fail-under=90
      - name: End-to-end demo
        run: python demo.py
        timeout-minutes: 8
